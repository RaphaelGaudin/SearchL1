name: Données et déploiement

on:
  push:
    branches: [main]
  # Secours de la mise à jour faite par le Mac (lundi 18 h 30, vendredi 8 h, heure de Paris).
  # GitHub lance les tâches planifiées avec parfois plusieurs heures de retard : on ne se fie pas à l'heure,
  # on réessaie toutes les heures après chaque créneau et le job « retard » décide d'après l'âge des données.
  schedule:
    - cron: '45 17-23 * * 1'
    - cron: '45 5-12 * * 2'
    - cron: '15 7-15 * * 5'
    - cron: '15 6-10 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Tâches planifiées : y a-t-il une mise à jour à faire ? Sinon, rien n'est lancé (ni build ni déploiement).
  retard:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.when.outputs.update }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: when
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          # Données plus anciennes que le dernier créneau, et le Mac a eu au moins une heure pour passer.
          elif npx -y tsx scripts/stale.mts --grace=60; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: retard
    if: github.event_name != 'schedule' || needs.retard.outputs.update == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mise à jour demandée ?
        id: when
        run: echo "update=${{ needs.retard.outputs.update }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache des feuilles de match Sofascore
        if: steps.when.outputs.update == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/sofascore
          key: sofascore-${{ github.run_id }}
          restore-keys: sofascore-

      - name: Navigateur pour Sofascore
        if: steps.when.outputs.update == 'true'
        run: npx playwright install --with-deps chromium

      - name: Mise à jour des données
        id: data
        if: steps.when.outputs.update == 'true'
        # Si une vérification échoue, le script n'écrit rien : on déploie les anciennes données.
        continue-on-error: true
        run: npm run data

      - name: Signaler un échec de mise à jour
        if: steps.data.outcome == 'failure'
        run: echo "::warning::Mise à jour des données échouée, anciennes données conservées (voir l'étape précédente)."

      - run: npm test

      - name: Commit des données
        if: steps.when.outputs.update == 'true' && steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/photos public/logos
          if git diff --cached --quiet; then
            echo "Données inchangées."
          else
            git commit -m "Données : mise à jour du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
